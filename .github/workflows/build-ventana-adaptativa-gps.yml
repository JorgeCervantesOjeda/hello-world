name: Build Ventana Adaptativa GPS

on:
  push:
    paths:
      - 'ventana-adaptativa-gps/**'
      - '.github/workflows/build-ventana-adaptativa-gps.yml'
  pull_request:
    paths:
      - 'ventana-adaptativa-gps/**'
      - '.github/workflows/build-ventana-adaptativa-gps.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p ventana-adaptativa-gps assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VentanaAdaptativaGPS
          path: ventana-adaptativa-gps/app/build/outputs/apk/debug/app-debug.apk
