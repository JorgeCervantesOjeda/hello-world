name: Build Ventana Adaptativa GPS

on:
  pull_request:
    paths:
      - 'adaptive-window-gps/**'
      - '.github/workflows/build-adaptive-window-gps.yml'
  push:
    branches:
      - adaptive-window-gps
    paths:
      - 'adaptive-window-gps/**'
      - '.github/workflows/build-adaptive-window-gps.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p adaptive-window-gps assembleDebug --stacktrace
      - name: Prepare named APK
        run: |
          cp adaptive-window-gps/app/build/outputs/apk/debug/app-debug.apk VentanaAdaptativaGPS.apk
          sha256sum VentanaAdaptativaGPS.apk > VentanaAdaptativaGPS.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: VentanaAdaptativaGPS
          path: |
            VentanaAdaptativaGPS.apk
            VentanaAdaptativaGPS.apk.sha256
