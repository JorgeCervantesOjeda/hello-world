name: Apply fixed seven-decimal speed display

on:
  push:
    branches:
      - agent/ventana-adaptativa-gps-clean
    paths:
      - .github/workflows/apply-fixed-seven-speed-decimals.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ventana-adaptativa-gps-clean

      - name: Update application
        shell: python
        run: |
          from pathlib import Path

          main = Path('ventana-adaptativa-gps/app/src/main/java/com/jorge/ventanaadaptativa/MainActivity.java')
          text = main.read_text(encoding='utf-8')
          replacements = {
              'import java.math.BigDecimal;\n': '',
              'speedText = text("0 km/h", 22, Color.rgb(17, 87, 138));': 'speedText = text("0.0000000 km/h", 22, Color.rgb(17, 87, 138));',
              'return BigDecimal.valueOf(value).stripTrailingZeros().toPlainString();': 'return String.format(Locale.getDefault(), "%.7f", value);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing MainActivity pattern: {old!r}')
              text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')

          gradle = Path('ventana-adaptativa-gps/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          replacements = {
              "applicationId 'com.jorge.ventanaadaptativa.github.v252'": "applicationId 'com.jorge.ventanaadaptativa.github.v253'",
              'versionCode 5': 'versionCode 6',
              "versionName '2.5.2-github'": "versionName '2.5.3-github'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing build.gradle pattern: {old!r}')
              text = text.replace(old, new, 1)
          gradle.write_text(text, encoding='utf-8')

          readme = Path('ventana-adaptativa-gps/README.md')
          text = readme.read_text(encoding='utf-8')
          section = '''\n## Velocímetro con siete decimales fijos — 2.5.3\n\nEl velocímetro principal muestra siempre exactamente siete cifras después del separador decimal. Por ejemplo: `0.0000000 km/h`, `83.4000000 km/h` y `83.4720001 km/h`. El redondeo a siete decimales afecta únicamente a la presentación; el controlador continúa usando el valor `double` completo almacenado.\n'''
          if '## Velocímetro con siete decimales fijos — 2.5.3' not in text:
              readme.write_text(text.rstrip() + '\n' + section, encoding='utf-8')

          workflow = Path('.github/workflows/apply-fixed-seven-speed-decimals.yml')
          workflow.unlink()

      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Show speed with seven fixed decimals"
          git push origin HEAD:agent/ventana-adaptativa-gps-clean
