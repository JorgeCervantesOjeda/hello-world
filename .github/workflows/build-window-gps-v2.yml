name: Build Ventana Adaptativa GPS v2

on:
  push:
    branches:
      - ventana-adaptativa-v2
    paths:
      - 'ventana-adaptativa-gps/**'
      - '.github/workflows/build-window-gps-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p ventana-adaptativa-gps assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          cp ventana-adaptativa-gps/app/build/outputs/apk/debug/app-debug.apk VentanaAdaptativaGPS-v2.apk
          sha256sum VentanaAdaptativaGPS-v2.apk > VentanaAdaptativaGPS-v2.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VentanaAdaptativaGPS-v2
          path: |
            VentanaAdaptativaGPS-v2.apk
            VentanaAdaptativaGPS-v2.apk.sha256
