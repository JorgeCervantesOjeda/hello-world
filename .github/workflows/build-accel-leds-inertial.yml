name: Build GPS Velocidad y Aceleración

on:
  push:
    paths:
      - 'accel-leds-inertial/**'
      - '.github/scripts/apply_v41_acceleration_dominant.py'
      - '.github/workflows/build-accel-leds-inertial.yml'
  pull_request:
    paths:
      - 'accel-leds-inertial/**'
      - '.github/workflows/build-accel-leds-inertial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-inertial-apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply dominant acceleration layout
        run: python3 .github/scripts/apply_v41_acceleration_dominant.py

      - name: Build debug APK
        run: gradle -p accel-leds-inertial assembleDebug --stacktrace

      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            accel-leds-inertial/app/src/main/java/com/example/accelledsinertial/MainActivity.java \
            accel-leds-inertial/app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m "Make GPS acceleration bar visually dominant [skip ci]"
            git pull --rebase origin agent/build-inertial-apk
            git push origin HEAD:agent/build-inertial-apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GPS-Aceleracion-Dominante-v4.1-staging
          path: |
            accel-leds-inertial/app/build/outputs/apk/debug/app-debug.apk
            accel-leds-inertial/app/src/main/java/com/example/accelledsinertial/MainActivity.java
            accel-leds-inertial/app/build.gradle
          if-no-files-found: error
