name: Build GPS Velocidad y Aceleración

on:
  push:
    paths:
      - 'accel-leds-inertial/**'
      - '.github/workflows/build-accel-leds-inertial.yml'
  pull_request:
    paths:
      - 'accel-leds-inertial/**'
      - '.github/workflows/build-accel-leds-inertial.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p accel-leds-inertial assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GPS-Aceleracion-Dominante-v4.1
          path: accel-leds-inertial/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
