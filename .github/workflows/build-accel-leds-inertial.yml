name: Build Accel LEDs Inercial

on:
  push:
    paths:
      - 'accel-leds-inertial/**'
      - '.github/workflows/build-accel-leds-inertial.yml'
  pull_request:
    paths:
      - 'accel-leds-inertial/**'
      - '.github/workflows/build-accel-leds-inertial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-inertial-apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply four-decimal speedometer
        run: python3 .github/scripts/apply_v30_speed_decimals.py

      - name: Build debug APK
        run: gradle -p accel-leds-inertial assembleDebug --stacktrace

      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            accel-leds-inertial/app/src/main/java/com/example/accelledsinertial/MainActivity.java \
            accel-leds-inertial/app/build.gradle
          git commit -m "Show GPS speed with four decimals"
          git push origin HEAD:agent/build-inertial-apk

      - uses: actions/upload-artifact@v4
        with:
          name: AccelLEDsInertial-v3.0-GPS-4decimales
          path: accel-leds-inertial/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
