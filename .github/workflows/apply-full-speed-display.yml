name: Apply full precision speed display

on:
  push:
    branches:
      - agent/ventana-adaptativa-gps-clean
    paths:
      - .github/workflows/apply-full-speed-display.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ventana-adaptativa-gps-clean

      - name: Update speed display and version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('ventana-adaptativa-gps/app/src/main/java/com/jorge/ventanaadaptativa/MainActivity.java')
          text = main.read_text(encoding='utf-8')

          replacements = [
              (
                  'import java.util.Locale;',
                  'import java.math.BigDecimal;\nimport java.util.Locale;'
              ),
              (
                  'speedText = text("0.0 km/h", 30, Color.rgb(17, 87, 138));',
                  'speedText = text("0 km/h", 22, Color.rgb(17, 87, 138));'
              ),
              (
                  'speedText.setText(String.format(Locale.getDefault(), "%.1f km/h", speedKmh));',
                  'speedText.setText(formatSpeedKmh(speedKmh) + " km/h");'
              ),
              (
                  'lastGpsSpeedKmh = location.getSpeed() * 3.6;',
                  'lastGpsSpeedKmh = ((double) location.getSpeed()) * 3.6d;'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected MainActivity text: {old}')
              text = text.replace(old, new, 1)

          marker = '    private static String formatMillimeters(double value) {'
          method = '''    private static String formatSpeedKmh(double value) {\n        if (!Double.isFinite(value)) return "no finita";\n        return BigDecimal.valueOf(value).stripTrailingZeros().toPlainString();\n    }\n\n'''
          if marker not in text:
              raise SystemExit('Missing formatMillimeters marker')
          text = text.replace(marker, method + marker, 1)
          main.write_text(text, encoding='utf-8')

          gradle = Path('ventana-adaptativa-gps/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          for old, new in [
              ("applicationId 'com.jorge.ventanaadaptativa.github.v251'", "applicationId 'com.jorge.ventanaadaptativa.github.v252'"),
              ('versionCode 4', 'versionCode 5'),
              ("versionName '2.5.1-github'", "versionName '2.5.2-github'"),
          ]:
              if old not in g:
                  raise SystemExit(f'Missing expected build.gradle text: {old}')
              g = g.replace(old, new, 1)
          gradle.write_text(g, encoding='utf-8')

          readme = Path('ventana-adaptativa-gps/README.md')
          r = readme.read_text(encoding='utf-8')
          section = '''\n## Velocímetro sin redondeo — 2.5.2\n\nEl velocímetro principal muestra la representación decimal completa necesaria para reconstruir exactamente el valor `double` almacenado en km/h. No se limita a una cifra decimal y la presentación no modifica el valor usado por el controlador. La velocidad GPS continúa originándose en `Location.getSpeed()` y se convierte explícitamente de m/s a km/h usando aritmética `double`.\n'''
          if '## Velocímetro sin redondeo — 2.5.2' not in r:
              r += section
          readme.write_text(r, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-full-speed-display.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ventana-adaptativa-gps/app/src/main/java/com/jorge/ventanaadaptativa/MainActivity.java \
                  ventana-adaptativa-gps/app/build.gradle \
                  ventana-adaptativa-gps/README.md \
                  .github/workflows/apply-full-speed-display.yml
          git commit -m "Show full stored GPS speed precision"
          git push
