name: Consolidate Accel LEDs v2.9 GPS

on:
  push:
    branches:
      - agent/build-inertial-apk
    paths:
      - '.github/workflows/build-accel-leds-inertial-v29-gps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-inertial-apk
          persist-credentials: true

      - name: Apply validated v2.9 source transformation
        run: |
          python3 accel-leds-inertial/tools/apply_v29_gps.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('accel-leds-inertial/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          text = text.replace('\n// Trigger de compilación v2.9 GPS.\n', '\n')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit consolidated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accel-leds-inertial/app/src/main/java/com/example/accelledsinertial/MainActivity.java
          git add accel-leds-inertial/app/build.gradle
          git add accel-leds-inertial/app/src/main/AndroidManifest.xml
          git commit -m "Consolidate v2.9 GPS speedometer source"
          git push origin HEAD:agent/build-inertial-apk
