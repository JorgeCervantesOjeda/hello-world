name: Apply flow display

on:
  push:
    branches:
      - agent/ventana-adaptativa-gps-clean
    paths:
      - .github/workflows/apply-flow-display.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ventana-adaptativa-gps-clean

      - name: Add calculated and requested flow indicators
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('ventana-adaptativa-gps/app/src/main/java/com/jorge/ventanaadaptativa/MainActivity.java')
          text = main_path.read_text()

          old = '''    private TextView speedText;
    private TextView gapText;
    private TextView stateText;'''
          new = '''    private TextView speedText;
    private TextView gapText;
    private TextView requestedFlowText;
    private TextView calculatedFlowText;
    private TextView flowDifferenceText;
    private TextView stateText;'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        gapText = text("Apertura: 0 mm", 26, Color.rgb(17, 87, 138));
        gapText.setGravity(Gravity.CENTER);
        root.addView(gapText);

        TextView manualHint = text('''
          new = '''        gapText = text("Apertura: 0 mm", 26, Color.rgb(17, 87, 138));
        gapText.setGravity(Gravity.CENTER);
        root.addView(gapText);

        requestedFlowText = text("Flujo solicitado: sin referencia", 18, Color.rgb(25, 45, 66));
        requestedFlowText.setGravity(Gravity.CENTER);
        root.addView(requestedFlowText);

        calculatedFlowText = text("Flujo real calculado: 0 mm·km/h", 18, Color.rgb(17, 87, 138));
        calculatedFlowText.setGravity(Gravity.CENTER);
        root.addView(calculatedFlowText);

        flowDifferenceText = text("Diferencia: sin referencia", 14, Color.DKGRAY);
        flowDifferenceText.setGravity(Gravity.CENTER);
        root.addView(flowDifferenceText);

        TextView flowHint = text(
                "Flujo relativo = apertura × velocidad. Se muestra en mm·km/h; para obtener m³/s se requiere calibrar el área real y la aerodinámica de la ventana.",
                13,
                Color.DKGRAY);
        flowHint.setGravity(Gravity.CENTER);
        root.addView(flowHint);

        TextView manualHint = text('''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        windowView.setGap(gapMm);

        if (active) {'''
          new = '''        windowView.setGap(gapMm);

        double calculatedFlow = gapMm * speedKmh;
        calculatedFlowText.setText(String.format(
                Locale.getDefault(),
                "Flujo real calculado: %s mm·km/h",
                formatFlow(calculatedFlow)));

        if (active) {
            double requestedFlow = referenceGapMm * referenceCalculationSpeedKmh;
            requestedFlowText.setText(String.format(
                    Locale.getDefault(),
                    "Flujo solicitado: %s mm·km/h",
                    formatFlow(requestedFlow)));

            double difference = calculatedFlow - requestedFlow;
            double differencePercent = requestedFlow > 0.0
                    ? difference * 100.0 / requestedFlow
                    : 0.0;
            flowDifferenceText.setText(String.format(
                    Locale.getDefault(),
                    "Diferencia: %s mm·km/h (%+.3f%%)",
                    formatSignedFlow(difference),
                    differencePercent));
        } else {
            requestedFlowText.setText("Flujo solicitado: sin referencia");
            flowDifferenceText.setText("Diferencia: sin referencia");
        }

        if (active) {'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    private static String formatMillimeters(double value) {
        if (value == 0.0) {
            return "0";
        }
        if (value > 0.0 && value < 1.0e-6) {
            return String.format(Locale.getDefault(), "%.6e", value);
        }
        if (value < 1.0) {
            return String.format(Locale.getDefault(), "%.9f", value);
        }
        return String.format(Locale.getDefault(), "%.6f", value);
    }

    private static final class WindowView extends View {'''
          new = '''    private static String formatMillimeters(double value) {
        if (value == 0.0) {
            return "0";
        }
        if (value > 0.0 && value < 1.0e-6) {
            return String.format(Locale.getDefault(), "%.6e", value);
        }
        if (value < 1.0) {
            return String.format(Locale.getDefault(), "%.9f", value);
        }
        return String.format(Locale.getDefault(), "%.6f", value);
    }

    private static String formatFlow(double value) {
        if (!Double.isFinite(value)) {
            return "no finito";
        }
        if (value == 0.0) {
            return "0";
        }
        double magnitude = Math.abs(value);
        if (magnitude < 1.0e-6 || magnitude >= 1.0e9) {
            return String.format(Locale.getDefault(), "%.6e", value);
        }
        if (magnitude < 1.0) {
            return String.format(Locale.getDefault(), "%.9f", value);
        }
        return String.format(Locale.getDefault(), "%.6f", value);
    }

    private static String formatSignedFlow(double value) {
        String formatted = formatFlow(Math.abs(value));
        if (value > 0.0) {
            return "+" + formatted;
        }
        if (value < 0.0) {
            return "−" + formatted;
        }
        return "0";
    }

    private static final class WindowView extends View {'''
          assert old in text
          text = text.replace(old, new, 1)

          main_path.write_text(text)

          gradle_path = Path('ventana-adaptativa-gps/app/build.gradle')
          gradle = gradle_path.read_text()
          gradle = gradle.replace("applicationId 'com.jorge.ventanaadaptativa.github.v250'", "applicationId 'com.jorge.ventanaadaptativa.github.v251'")
          gradle = gradle.replace('versionCode 3', 'versionCode 4')
          gradle = gradle.replace("versionName '2.5.0-github'", "versionName '2.5.1-github'")
          gradle_path.write_text(gradle)

          readme_path = Path('ventana-adaptativa-gps/README.md')
          readme = readme_path.read_text()
          marker = '## Velocidad GPS almacenada\n'
          section = '''## Indicadores de flujo\n\nLa interfaz muestra continuamente dos magnitudes en unidades relativas `mm·km/h`:\n\n```text\nflujo_solicitado = apertura_referencia × velocidad_referencia_de_cálculo\nflujo_real_calculado = apertura_actual × velocidad_real\n```\n\nTambién muestra la diferencia absoluta y porcentual. Durante un ajuste automático, el flujo real calculado converge al solicitado. A 0 km/h el flujo real calculado es cero incluso con 450 mm de apertura, porque el movimiento del vehículo no produce flujo en ese estado.\n\nEstas unidades son un índice proporcional, no un caudal volumétrico. Para mostrar m³/s se necesita calibrar el área real de la abertura, la conversión posición-área y el coeficiente aerodinámico.\n\n'''
          assert marker in readme
          readme = readme.replace(marker, section + marker, 1)
          readme_path.write_text(readme)

          Path('.github/workflows/apply-flow-display.yml').unlink()
          PY

      - name: Commit updated simulator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show requested and calculated airflow"
          git push origin HEAD:agent/ventana-adaptativa-gps-clean
